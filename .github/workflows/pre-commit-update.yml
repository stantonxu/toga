name: Update pre-commit

on:
  schedule:
    - cron: "0 20 * * SUN" # Sunday @ 2000 UTC
  workflow_dispatch:

jobs:
  pre-commit-update:
    name: Update pre-commit
    if: github.repository == 'beeware/toga'
    uses: beeware/.github/.github/workflows/pre-commit-update.yml@main
    secrets:
      BRUTUS_PAT_TOKEN: ${{ secrets.BRUTUS_PAT_TOKEN }}
    with:
      pre-commit-source: "--group pre-commit"
      changenote-format: "md"
